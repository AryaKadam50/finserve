# ============================================================
# FinServe — Nginx Configuration
# ============================================================
# Serves the React frontend on port 80 and proxies
# /api requests to Spring Boot on port 8080.
#
# Install to: /etc/nginx/conf.d/finserve.conf
# ============================================================

server {
    listen 80;
    server_name finservearya.duckdns.org;

    # ---------- React Frontend ----------
    root /var/www/finserve;
    index index.html;

    # SPA fallback — all non-file routes go to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- API Reverse Proxy ----------
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ---------- Security Headers ----------
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";

    # ---------- Static Asset Caching ----------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---------- Gzip ----------
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 256;
}
