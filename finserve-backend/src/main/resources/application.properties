spring.application.name=finserve
server.port=8080

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:finserve_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:finserve123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# File upload configuration
upload.path=${UPLOAD_PATH:/opt/finserve/uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Document verification rules
# Income tolerance in percent (e.g. 5 means within 5% is a MATCH)
verification.income.tolerance.percent=5

# AI / LLM configuration
# OPENAI_API_KEY must be set as an environment variable — never hardcode it here
ai.openai.model=gpt-4o-mini
ai.openai.timeout.seconds=30
# Confidence threshold: below this value, human review is forced regardless of recommendation
ai.underwriting.confidence.threshold=0.70

# Loan policy rules (configurable without code changes)
policy.min.credit.score=650
policy.max.dti.ratio=0.45
policy.min.income=50000
policy.max.loan.to.income.multiplier=60

# Admin seeder — override via environment variables in production
# NEVER hardcode real credentials here
admin.email=${ADMIN_EMAIL:admin@finserve.com}
admin.password=${ADMIN_PASSWORD:admin123}

# Spring Boot Actuator — health and metrics
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Logging — never log passwords, tokens or API keys
logging.level.com.finserve=INFO
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
