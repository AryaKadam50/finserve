version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: finserve-mysql
    environment:
      MYSQL_DATABASE: finserve_db
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-finserve123}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./finserve-backend
    container_name: finserve-backend
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=finserve_db
      - DB_USERNAME=root
      - DB_PASSWORD=${DB_PASSWORD:-finserve123}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@finserve.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./finserve-frontend
    container_name: finserve-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  db_data:
